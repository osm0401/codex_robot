<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 육아 로봇</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/baby.js" defer></script>
  </head>
  <body>
    <main class="nursery">
      <header class="top">
        <h1>AI 육아 로봇</h1>
        <a href="#help">도움말</a>
      </header>

      <section class="baby" aria-label="가상 아기 상태">
        <p id="demo" class="demo" hidden>데모 모드</p>
        <svg id="portrait" class="portrait" viewBox="0 0 240 204" data-face="neutral" aria-hidden="true">
          <circle cx="120" cy="101" r="92" fill="#fef8e7"/>
          <path d="M65 185c4-32 22-47 55-47s51 15 55 47c-33 22-77 22-110 0Z" fill="#a6c6aa"/>
          <path d="m80 162 40 19 40-19M104 181l16 8 16-8" fill="none" stroke="#799b84" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="65" cy="107" rx="13" ry="17" fill="#e7a887"/>
          <ellipse cx="175" cy="107" rx="13" ry="17" fill="#e7a887"/>
          <ellipse cx="120" cy="99" rx="58" ry="61" fill="#f8c6a6"/>
          <path d="M103 43c-2-13 10-22 20-16 7 4 4 14-4 13-9-1-9-15 6-19" fill="none" stroke="#704932" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="83" cy="119" rx="11" ry="6" fill="#eb9c8b"/>
          <ellipse cx="157" cy="119" rx="11" ry="6" fill="#eb9c8b"/>
          <g class="expression open-eyes"><ellipse cx="98" cy="102" rx="4.5" ry="6"/><ellipse cx="142" cy="102" rx="4.5" ry="6"/></g>
          <g class="expression closed-eyes"><path d="M89 102q9 8 18 0m26 0q9 8 18 0"/></g>
          <g class="expression neutral-mouth"><path d="M114 127q6 4 12 0"/></g>
          <g class="expression smiling-mouth"><path d="M108 122q12 22 24 0Z" fill="#925654"/></g>
          <g class="expression round-mouth"><ellipse cx="120" cy="126" rx="7" ry="8" fill="#925654"/></g>
          <g class="expression tears" stroke="none" fill="#75a9c2"><path d="M94 111q-11 10-4 15 9 3 4-15Zm52 0q11 10 4 15-9 3-4-15Z"/></g>
        </svg>
        <p id="age" class="age">월령 확인 중</p>
        <p id="emotion" class="emotion" aria-live="polite">아기를 깨우는 중이에요</p>
        <p id="signal" class="signal" hidden></p>
      </section>

      <section class="care" aria-labelledby="care-title">
        <h2 id="care-title">돌봄</h2>
        <div class="actions">
          <button type="button" data-care="feed" disabled>밥 주기</button>
          <button type="button" data-care="burp" disabled>트림 돕기</button>
          <button type="button" data-care="diaper" disabled>기저귀 갈기</button>
          <button type="button" data-care="sleep" disabled>재우기</button>
          <button type="button" data-care="hold" disabled>안아 주기</button>
        </div>
        <p id="notice" class="notice" role="status"></p>
      </section>

      <details id="help" class="help">
        <summary>시뮬레이션 도움말과 자료 출처</summary>
        <p>화면 속 아기의 표정과 행동을 보고 돌봄 버튼을 눌러 보세요. 표시된 월령은 시뮬레이션 안에서만 사용합니다.</p>
        <ul id="sources"></ul>
      </details>
    </main>
  </body>
</html>
